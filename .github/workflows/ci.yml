name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  sast:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Bandit
        run: pip install bandit
      - name: Run Bandit
        run: bandit -r . -x ./venv,./.venv

  sca:
    name: SCA (pip-audit + OWASP Dependency-Check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: littleNotes
          path: .
          format: HTML
          out: reports
          args: >
            --enableExperimental
            --nvdApiKey ${{ secrets.NVD_API_KEY }}
      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: dependency-check-report
          path: reports
